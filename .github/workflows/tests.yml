name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11.5", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          pip install -c constraints-runtime.txt -e ".[dev]"

      - name: Audit runtime dependencies
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install pip-audit==2.10.0
          pip-audit --skip-editable

      - name: Lint (ruff)
        run: |
          ruff check substack2md tests scripts
          ruff format --check substack2md tests scripts

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Build wheel and smoke test a clean installation
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
          python scripts/smoke_wheel.py "$RUNNER_TEMP"/wheels/substack2md-*.whl
