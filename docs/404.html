<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 &mdash; substack2md</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0f1117;
      --bg-alt: #1a1d27;
      --text: #e1e4ed;
      --text-muted: #8b90a0;
      --accent: #f59e42;
      --accent-hover: #fbb471;
      --border: #2e3345;
      --mono: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      line-height: 1.6;
    }
    .card {
      max-width: 560px;
      width: 100%;
      text-align: center;
    }
    .code {
      font-family: var(--mono);
      color: var(--accent);
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 1rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; letter-spacing: -0.01em; }
    p { color: var(--text-muted); margin-bottom: 1.5rem; }
    pre {
      background: #0b0d13;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      font-family: var(--mono);
      font-size: 0.85rem;
      color: var(--text);
      text-align: left;
      margin-bottom: 1.5rem;
      overflow-x: auto;
    }
    a.btn {
      display: inline-block;
      padding: 0.6rem 1.25rem;
      background: var(--accent);
      color: var(--bg);
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.9rem;
    }
    a.btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>That post is not in this archive.</h1>
    <p>The URL you followed does not match any page on substack2md.space. Try the home page, or grab the tool and convert the post yourself.</p>
    <pre>$ substack2md &lt;the-url-you-were-looking-for&gt;</pre>
    <a href="https://substack2md.space/" class="btn">Return home</a>
  </div>
</body>
</html>
